services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: revora
      POSTGRES_PASSWORD: revora
      POSTGRES_DB: revora
    ports:
      - "5432:5432"
    volumes:
      - revora_pgdata:/var/lib/postgresql/data

volumes:
  revora_pgdata:
