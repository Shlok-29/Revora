services:
  - type: web
    name: revora-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate --schema backend/prisma/schema.prisma
    startCommand: node backend/src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
